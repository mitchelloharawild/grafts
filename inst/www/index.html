<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph explorer</title>
<script>
  // The saved theme before the page draws, so it doesn't flash light
  try { var t = JSON.parse(localStorage.getItem('graph-explore-theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage blocked */ }
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="graph-explore.css">
</head>
<body>
<div id="gx" class="gx"><p class="gx-loading">Loading the series graph…</p></div>
<script src="graph-explore.js"></script>
</body>
</html>
