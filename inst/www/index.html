<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph explorer</title>
<link rel="stylesheet" href="grafts.css">
<style>
  /* Source Sans 3 (SIL OFL), served beside the app rather than from a third party */
  @font-face { font-family: 'Source Sans 3'; font-weight: 400; font-display: swap; src: url(fonts/source-sans-3-400.woff2) format('woff2'); }
  @font-face { font-family: 'Source Sans 3'; font-weight: 600; font-display: swap; src: url(fonts/source-sans-3-600.woff2) format('woff2'); }
  @font-face { font-family: 'Source Sans 3'; font-weight: 700; font-display: swap; src: url(fonts/source-sans-3-700.woff2) format('woff2'); }
  /* The standalone app fills the window */
  html, body { margin: 0; height: 100%; background: #F6F7F9; }
  @media (prefers-color-scheme: dark) { html, body { background: #0F1115; } }
  body > .grafts-root { height: 100vh; }
</style>
</head>
<body>
<div id="grafts-root" class="grafts-root"><p class="grafts-loading">Loading the series graph…</p></div>
<script src="grafts.js"></script>
<script>
  Grafts.mount(document.getElementById('grafts-root'), { source: Grafts.remote() })
    .then(function (x) { window.explorer = x; });
</script>
</body>
</html>
